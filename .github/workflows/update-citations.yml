name: Update Google Scholar Citations

on:
  schedule:
    - cron: "0 0 * * 1"
    - cron: "0 0 * * 3"
    - cron: "0 0 * * 5"
  workflow_dispatch:

jobs:
  update-citations:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Show citation package versions
        run: |
          python --version
          pip show scholarly
          pip show bibtexparser
          pip show requests

      - name: Test Google Scholar access
        run: |
          python - <<'PY'
          import requests
          url = "https://scholar.google.com/citations?user=UO9r2PsAAAAJ"
          r = requests.get(url, timeout=15)
          print("HTTP status:", r.status_code)
          print("Final URL:", r.url)
          print("Response length:", len(r.text))
          print("Contains CAPTCHA:", "captcha" in r.text.lower())
          print("Contains profile:", "Hou Yi Chia" in r.text)
          PY

      - name: Run citation update
        run: |
          python bin/update_scholar_citations.py

      - name: Commit and push if changed
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add _data/citations.yml
          git diff --staged --quiet || (
            git commit -m "Update Google Scholar citations"
            git push
          )
