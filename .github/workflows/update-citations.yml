name: Update Google Scholar Citations

on:
  schedule:
    - cron: "0 0 * * 1"
    - cron: "0 0 * * 3"
    - cron: "0 0 * * 5"
  workflow_dispatch:

jobs:
  update-citations:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Show citation package versions
        run: |
          python --version
          pip show scholarly
          pip show bibtexparser
          pip show requests

      - name: Run citation update
        run: |
          python bin/update_scholar_citations.py

      - name: Commit and push if changed
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add _data/citations.yml
          git diff --staged --quiet || (
            git commit -m "Update Google Scholar citations"
            git push
          )
